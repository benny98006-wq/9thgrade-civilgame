<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貨幣與文明：從以物易物到現代金融 | 公民教學資源網</title>
    <style>
        :root {
            /* 歷史主題色：象徵陶土、黃金、羊皮紙 */
            --history-primary: #8B4513; 
            --history-bg: #FDF5E6;
            
            /* 現代主題色：象徵科技、數據、公民社會 */
            --civics-primary: #2C3E50;
            --civics-accent: #3498DB;
            
            --text-color: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--history-bg) 0%, #E8F6F3 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header 區域 */
        header {
            text-align: center;
            padding: 3rem 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--history-primary), var(--civics-accent));
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 主要內容區域 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
            flex-wrap: wrap;
        }

        /* 卡片設計 */
        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: var(--white);
            width: 350px;
            height: 400px;
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 1rem;
            transition: transform 0.4s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
        }

        .card-desc {
            font-size: 1rem;
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        /* 個別風格設定 */
        /* 左側：文明交易進化論 */
        .style
