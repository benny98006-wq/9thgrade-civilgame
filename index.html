<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貨幣與文明：從以物易物到現代金融 | 公民教學資源網</title>
    <style>
        :root {
            /* 歷史主題色：象徵陶土、黃金、羊皮紙 */
            --history-primary: #8B4513; 
            --history-bg: #FDF5E6;
            
            /* 現代主題色：象徵科技、數據、公民社會 */
            --civics-primary: #2C3E50;
            --civics-accent: #3498DB;
            
            --text-color: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--history-bg) 0%, #E8F6F3 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header 區域 */
        header {
            text-align: center;
            padding: 3rem 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--history-primary), var(--civics-accent));
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 主要內容區域 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
            flex-wrap: wrap;
        }

        /* 卡片設計 */
        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: var(--white);
            width: 350px;
            height: 400px;
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 1rem;
            transition: transform 0.4s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
        }

        .card-desc {
            font-size: 1rem;
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        /* 個別風格設定 */
        /* 左側：文明交易進化論 */
        .style-history {
            border-top: 5px solid var(--history-primary);
        }
        .style-history .icon-box { color: var(--history-primary); }
        .style-history .card-title { color: var(--history-primary); }
        .style-history .btn {
            background-color: var(--history-bg);
            color: var(--history-primary);
            border: 2px solid var(--history-primary);
        }
        .style-history:hover .btn {
            background-color: var(--history-primary);
            color: var(--white);
        }

        /* 右側：互動式貨幣演進 */
        .style-civics {
            border-top: 5px solid var(--civics-accent);
        }
        .style-civics .icon-box { color: var(--civics-accent); }
        .style-civics .card-title { color: var(--civics-primary); }
        .style-civics .btn {
            background-color: #EBF5FB;
            color: var(--civics-accent);
            border: 2px solid var(--civics-accent);
        }
        .style-civics:hover .btn {
            background-color: var(--civics-accent);
            color: var(--white);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #888;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.5);
        }

        /* RWD */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
            .card {
                width: 100%;
                max-width: 320px;
                height: auto;
                min-height: 350px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>貨幣的演進</h1>
        <p class="subtitle">探索從以物易物到現代金融體系的奇妙旅程</p>
    </header>

    <main>
        <a href="bankinggame.html" class="card-link">
            <article class="card style-history">
                <div class="icon-box">🏺</div>
                <h2 class="card-title">文明交易進化論</h2>
                <p class="card-desc">
                    回到過去，探索貨幣起源。<br>
                    從自給自足、以物易物到金屬貨幣，<br>
                    透過互動了解交易媒介的演變歷史。
                </p>
                <div class="btn">開始探索</div>
            </article>
        </a>

        <a href="exchanging.html" class="card-link">
            <article class="card style-civics">
                <div class="icon-box">📊</div>
                <h2 class="card-title">到底應該怎麼算？</h2>
                <p class="card-desc">
                    進入現代，掌握金融工具。<br>
                    體驗匯率計算、法定貨幣運作，<br>
                    透過互動工具認識現代公民經濟生活。
                </p>
                <div class="btn">開始計算</div>
            </article>
        </a>
    </main>

    <footer>
        <p>&copy; 2025 公民與社會科教育實習@Benny | Designed for 9th Grade Civics</p>
    </footer>

</body>

</html>
